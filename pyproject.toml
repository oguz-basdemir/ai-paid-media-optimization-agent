[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-paid-media-optimization-agent"
version = "1.0.0"
description = "Explainable paid-media analytics and human-approved experimentation using synthetic data"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.45,<2", "pandas>=2.2,<3", "numpy>=1.26,<2.4", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "playwright>=1.51,<2"]

[tool.setuptools.packages.find]
include = ["paid_media*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
